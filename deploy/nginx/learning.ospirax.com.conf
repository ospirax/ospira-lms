# Referencing certificate files that do not exist yet makes `nginx -t`
# fail, which is why this starts commented out.
#
# `listen 443 ssl http2;` is the correct form for nginx 1.24, which is what
# Ubuntu 24.04 ships. On nginx 1.25+ use `listen 443 ssl;` with a separate
# `http2 on;` line. Check with: nginx -v
