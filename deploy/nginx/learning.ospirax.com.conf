# nginx vhost for learning.ospirax.com -> Moodle container on 127.0.0.1:8081
#
# This host also serves six other Ospira sites, so this file is written to
# be as inert as possible toward them:
#
#   - server_name is exact. No wildcard, no regex, no catch-all.
#   - `default_server` is deliberately NOT set, so this vhost can never
#     absorb traffic whose Host header matches something else.
#   - TLS is added in a second phase, by hand, so `certbot --nginx` never
#     rewrites shared configuration.
#
# If nothing is listening on 80/443, skip this file entirely and use the
# Caddy edge profile instead - it touches no system config at all.
#
# ---------------------------------------------------------------------
# PHASE 1 - install this file as-is, HTTP only.
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/learning.ospirax.com.conf \
#           /etc/nginx/sites-available/learning.ospirax.com
#   sudo ln -s /etc/nginx/sites-available/learning.ospirax.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# PHASE 2 - get the certificate WITHOUT letting certbot edit nginx:
#
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d learning.ospirax.com
#
# `certonly` writes only to /etc/letsencrypt. It does not modify any nginx
# file. Once it succeeds, uncomment the TLS block at the bottom, uncomment
# the redirect in the port-80 block, then `nginx -t` and reload again.
# ---------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    # Exact match only. Never add default_server here.
    server_name learning.ospirax.com;

    # ACME challenge. Must stay reachable over plain HTTP for renewals,
    # so keep this above any redirect. `^~` stops nginx evaluating the
    # proxy location for these paths.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # PHASE 2: uncomment to force HTTPS once the certificate exists.
    # return 301 https://$host$request_uri;

    # Course backups and SCORM packages are large; nginx's 1MB default
    # rejects them with a 413. Keep at or above Moodle's maxbytes setting.
    client_max_body_size 200M;

    # Moodle restores and long admin pages exceed the 60s default.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        # 8081, not 8080 - the previous Moodle LMS owns 8080 on this host.
        # Must match MOODLE_BIND_PORT in .env.
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;

        # MOODLE_SSLPROXY reads this. Without it Moodle emits http:// links
        # behind the proxy and browsers hit a redirect loop.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }
}

